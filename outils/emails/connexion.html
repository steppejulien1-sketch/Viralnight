<!doctype html>
<html lang="fr">
  <body style="margin:0;padding:0;background:#f5f5f6;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f5f5f6;">
      <tr>
        <td align="center" style="padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:440px;background:#ffffff;border-radius:20px;">
            <tr>
              <td align="center" style="padding:32px 28px 8px;">
                <img src="https://viralnight-koif.vercel.app/email/noctify-logo.png" width="190" height="101" alt="Noctify" style="display:block;border:0;outline:none;" />
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:12px 28px 0;font-size:22px;line-height:1.25;font-weight:800;color:#15181d;letter-spacing:-0.02em;">
                Ton code de connexion
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:8px 28px 0;font-size:15px;line-height:1.5;color:#5c6370;">
                Saisis-le dans l’appli Noctify.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:22px 28px 6px;">
                <div style="display:inline-block;padding:14px 22px;border-radius:14px;background:#f1f1f3;font-size:34px;line-height:1;font-weight:800;letter-spacing:0.28em;color:#15181d;font-variant-numeric:tabular-nums;">{{ .Token }}</div>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:8px 28px 0;font-size:13px;line-height:1.5;color:#80858d;">
                Il expire dans une heure.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:20px 28px 30px;font-size:13px;line-height:1.5;color:#5c6370;">
                Tu es sur le navigateur ? <a href="{{ .ConfirmationURL }}" style="color:#15181d;font-weight:700;text-decoration:underline;">Te connecter avec ce lien</a>
              </td>
            </tr>
          </table>
          <p style="max-width:440px;margin:18px auto 0;font-size:12px;line-height:1.5;color:#8a8f98;text-align:center;">
            Tu n’as pas demandé ce code ? Ignore cet e-mail.<br />
            Une question : <a href="mailto:noctify.support@gmail.com" style="color:#5c6370;">noctify.support@gmail.com</a>
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
