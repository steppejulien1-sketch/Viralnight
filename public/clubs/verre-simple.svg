<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Club">
  <!-- Le repere d'un club qui n'a pas encore depose sa photo.
       Julien : "je ne veux pas un des cocktails qu'on a dans la liste,
       je veux juste un tout petit dessin de cocktail simple, juste des
       lignes, qui fait le taf."

       Donc PAS art-cocktail.webp : ces dessins-la sont des recompenses,
       pleins et colores. Reutilises comme repere de club, ils disaient
       "un cocktail offert ici" au lieu de "un club". Celui-ci est au
       trait, comme les icones de la barre d'onglets : il se lit comme un
       signe, pas comme un objet.

       ⚠️ TRAIT DE 1,15, PAS 1,7 comme les icones de la barre d'onglets.
       Celles-la s'affichent a leur taille native (~22 px) ; ce dessin-ci
       est agrandi jusqu'a 50 px dans le rond d'une fiche, ce qui
       multiplie l'epaisseur par deux. A 1,7 il sortait pateux. -->
  <g fill="none" stroke="#16181d" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.6 6.4h14.8L12 14.2z"/>
    <path d="M12 14.2v4.6"/>
    <path d="M8.6 19.4h6.8"/>
    <path d="M17.4 4.1l-2.1 3"/>
  </g>
  <circle cx="17.8" cy="3.6" r="1.15" fill="#16181d"/>
</svg>
