<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Noctify | Gagne tes récompenses</title>
    <meta name="description" content="Scanne, publie, gagne des récompenses dans ton club." />
    <link rel="icon" href="./assets/favicon-vn.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#040506" />
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="./base.css" />
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./scan.css" />
  </head>
  <body>
    <main class="sc-shell">
      <header class="sc-header">
        <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true"><path d="M12 2.4c.5 3.8 1.4 6.4 2.9 7.9 1.5 1.5 4.1 2.4 7.9 2.9-3.8.5-6.4 1.4-7.9 2.9-1.5 1.5-2.4 4.1-2.9 7.9-.5-3.8-1.4-6.4-2.9-7.9-1.5-1.5-4.1-2.4-7.9-2.9 3.8-.5 6.4-1.4 7.9-2.9 1.5-1.5 2.4-4.1 2.9-7.9Z" fill="#ff6363"/></svg>
        <p class="sc-club" id="club-name">Chargement…</p>
      </header>

      <!-- Etat 1 : enregistrement du passage -->
      <section class="sc-step" id="step-checkin">
        <div class="sc-status" id="checkin-status">
          <span class="sc-spinner" aria-hidden="true"></span>
          <p>Enregistrement de ton passage…</p>
        </div>
      </section>

      <!-- Etat 2 : soumission de la publication -->
      <section class="sc-step" id="step-post" hidden>
        <h1>Tu es enregistré</h1>
        <p class="sc-lead">
          Publie une story ou une vidéo du club, puis colle le lien ici pour gagner tes points.
        </p>

        <form id="post-form" class="sc-form">
          <label class="sc-field">
            <span>Lien de ta publication</span>
            <input
              type="url"
              id="post-url"
              inputmode="url"
              autocomplete="off"
              placeholder="https://instagram.com/…"
              required
            />
          </label>

          <fieldset class="sc-types">
            <legend>Type de contenu</legend>
            <label><input type="radio" name="contentType" value="story" checked /><span>Story</span></label>
            <label><input type="radio" name="contentType" value="reel" /><span>Reel</span></label>
            <label><input type="radio" name="contentType" value="video" /><span>Vidéo</span></label>
            <label><input type="radio" name="contentType" value="post" /><span>Post</span></label>
          </fieldset>

          <label class="sc-field">
            <span>Nombre de vues <em>(optionnel)</em></span>
            <input type="number" id="post-views" inputmode="numeric" min="0" placeholder="Ex : 1200" />
          </label>

          <button type="submit" id="post-send">Envoyer ma publication</button>
        </form>

        <p class="sc-note" id="post-status" role="status" hidden></p>

        <ul class="sc-sent" id="post-list"></ul>
      </section>

      <!-- Etat 3 : erreur bloquante -->
      <section class="sc-step" id="step-error" hidden>
        <h1 id="error-title">Un problème est survenu</h1>
        <p class="sc-lead" id="error-message"></p>
        <button type="button" id="retry" class="sc-secondary">Réessayer</button>
      </section>

      <footer class="sc-footer">
        <p>Tes points sont validés par l'équipe du club après vérification de la publication.</p>
      </footer>
    </main>

    <script type="module" src="./scan.js"></script>
  </body>
</html>
