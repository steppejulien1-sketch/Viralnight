<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ViralNight | Assistant</title>
    <meta name="description" content="Assistant conversationnel ViralNight : posez vos questions sur vos soirées et obtenez une analyse détaillée." />
    <link rel="icon" href="./assets/favicon-vn.svg" type="image/svg+xml" />
    <link rel="preload" href="./assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#040506" />
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="./base.css" />
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./chat.css" />
  </head>
  <body>
    <div class="ch-shell">
      <header class="ch-header">
        <a class="brand" href="./index.html" aria-label="ViralNight">
          <img src="./assets/logo-mark.png" alt="" width="30" height="30" />
          <span>Assistant</span>
        </a>

        <label class="ch-picker">
          <span class="ch-picker-label">Soirée</span>
          <select id="event-select" disabled>
            <option value="">Chargement…</option>
          </select>
        </label>

        <button type="button" id="reset" class="ch-reset" title="Effacer la conversation">
          Nouvelle conversation
        </button>
      </header>

      <p class="ch-banner" id="banner" role="status" hidden></p>

      <div class="ch-thread" id="thread" aria-live="polite" aria-label="Conversation"></div>

      <div class="ch-composer">
        <div class="ch-chips" id="chips"></div>
        <form class="ch-form" id="form">
          <textarea
            id="input"
            rows="1"
            placeholder="Posez votre question sur cette soirée…"
            aria-label="Votre message"
            autocomplete="off"
          ></textarea>
          <button type="submit" id="send" aria-label="Envoyer">Envoyer</button>
        </form>
        <p class="ch-hint">
          L'assistant ne répond qu'à partir des chiffres calculés sur vos soirées. Il peut se
          tromper d'interprétation — vérifiez les décisions importantes.
        </p>
      </div>
    </div>

    <script type="module" src="./chat.js"></script>
  </body>
</html>
