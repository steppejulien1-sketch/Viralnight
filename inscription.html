<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ViralNight | Créer votre espace</title>
    <meta name="description" content="Créez l'espace ViralNight de votre club." />
    <link rel="icon" href="./assets/favicon-vn.svg" type="image/svg+xml" />
    <link rel="preload" href="./assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./assets/hero-nightclub.webp" as="image" fetchpriority="high" />
    <meta name="theme-color" content="#030405" />
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="./base.css" />
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./auth.css" />
  </head>
  <body>
    <div class="au-bg" aria-hidden="true"></div>
    <div class="noise" aria-hidden="true"></div>

    <div class="au-layout">

      <header class="au-top">
        <a class="au-brand" href="./index.html" aria-label="ViralNight — retour au site">
          <svg class="au-brand-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.4c.5 3.8 1.4 6.4 2.9 7.9 1.5 1.5 4.1 2.4 7.9 2.9-3.8.5-6.4 1.4-7.9 2.9-1.5 1.5-2.4 4.1-2.9 7.9-.5-3.8-1.4-6.4-2.9-7.9-1.5-1.5-4.1-2.4-7.9-2.9 3.8-.5 6.4-1.4 7.9-2.9 1.5-1.5 2.4-4.1 2.9-7.9Z" fill="#ff6363"/></svg>
          <span>ViralNight</span>
        </a>
      </header>

      <main class="au-shell">
        <div class="au-card">

          <h1 id="title">Créer votre espace</h1>
          <p class="au-lead" id="lead">
            Vous serez le responsable du club. Vous pourrez inviter votre équipe ensuite.
          </p>

          <!-- Etat "session deja ouverte", rempli par auth.js -->
          <div id="session" hidden>
            <div class="au-account">
              <span class="au-avatar" id="session-initial" aria-hidden="true"></span>
              <span class="au-account-text">
                <span class="au-account-label">Compte connecté</span>
                <span class="au-account-mail" id="session-email"></span>
              </span>
            </div>
            <button type="button" class="au-submit" id="session-go">Aller à mon espace</button>
            <button type="button" class="au-ghost" id="session-out">Utiliser un autre compte</button>
          </div>

          <div id="guest">
            <button type="button" class="au-google" id="google">
              <svg viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
              </svg>
              S'inscrire avec Google
            </button>

            <p class="au-sep">ou par e-mail</p>

            <form class="au-form" id="form">
              <div class="au-field">
                <label class="au-label" for="club">Nom de votre club</label>
                <div class="au-input-wrap">
                  <input type="text" id="club" name="club" autocomplete="organization" required placeholder="Le Nouveau Monde, Silencio…" />
                </div>
              </div>

              <div class="au-field">
                <label class="au-label" for="email">Email</label>
                <div class="au-input-wrap">
                  <input type="email" id="email" name="email" autocomplete="email" required placeholder="votre@email.com" />
                </div>
              </div>

              <div class="au-field">
                <label class="au-label" for="password">Mot de passe</label>
                <div class="au-input-wrap">
                  <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8" placeholder="8 caractères minimum" />
                  <button type="button" class="au-eye" id="toggle" aria-label="Afficher le mot de passe">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                      <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                  </button>
                </div>
                <span class="au-hint">8 caractères minimum, dont un chiffre.</span>
              </div>

              <div class="au-check">
                <input type="checkbox" id="cgu-consent" name="cgu-consent" required />
                <label for="cgu-consent">
                  J'accepte les <a href="./cgu.html" target="_blank" rel="noopener">Conditions d'utilisation</a>
                  et la <a href="./confidentialite.html" target="_blank" rel="noopener">Politique de confidentialité</a>.
                </label>
              </div>

              <button type="submit" class="au-submit" id="submit">Créer mon espace</button>
            </form>
          </div>

          <p class="au-msg is-info" id="message" hidden></p>

          <p class="au-foot" id="foot">
            Vous avez déjà un compte ? <a href="./connexion.html">Se connecter</a>
          </p>
        </div>
      </main>

    </div>

    <script type="module" src="./auth.js"></script>
  </body>
</html>
