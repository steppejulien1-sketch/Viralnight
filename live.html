<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ViralNight | Soirée en cours</title>
    <meta name="description" content="Suivi en direct de la soirée : entrées, publications et récompenses minute par minute." />
    <link rel="icon" href="./assets/favicon-vn.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#040506" />
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="./base.css" />
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./live.css" />
  </head>
  <body>
    <main class="lv-shell">
      <header class="lv-header">
        <a class="brand" href="./app.html">
          <img src="./assets/logo-mark.png" alt="" width="30" height="30" />
          <span>Soirée en cours</span>
        </a>

        <div class="lv-header-right">
          <span class="lv-pulse" id="pulse" hidden>
            <span class="lv-dot"></span>
            <span id="pulse-label">en direct</span>
          </span>
          <button type="button" id="refresh" class="lv-secondary">Actualiser</button>
        </div>
      </header>

      <p class="lv-banner" id="banner" role="status" hidden></p>

      <section class="lv-hero" id="hero" hidden>
        <p class="lv-eyebrow" id="event-date"></p>
        <h1 id="event-name"></h1>
        <p class="lv-dj" id="event-dj"></p>
      </section>

      <section class="lv-stats" id="stats" hidden></section>

      <section class="lv-block" id="curve-block" hidden>
        <h2>L'activité heure par heure</h2>
        <p class="lv-sub">Entrées et publications depuis l'ouverture.</p>
        <div class="lv-hours" id="hours"></div>
      </section>

      <section class="lv-block" id="feed-block" hidden>
        <h2>Dernières publications</h2>
        <p class="lv-sub" id="feed-sub"></p>
        <ul class="lv-feed" id="feed"></ul>
      </section>

      <footer class="lv-footer">
        <p>
          Les publications apparaissent dès qu'un client envoie son lien. Elles ne rapportent
          des points qu'après validation depuis
          <a href="./admin.html">la file de validation</a>.
        </p>
      </footer>
    </main>

    <script type="module" src="./live.js"></script>
  </body>
</html>
